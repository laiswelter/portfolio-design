<script>
  // Resolve asset paths to inlined blob URLs in the standalone bundle;
  // falls back to the original path on the regular dev page.
  window.bundledUrl = function (path) {
    if (!path || typeof path !== 'string' || path.indexOf('assets/') !== 0) return path;
    var id = path.replace(/^assets\//, '').replace(/\.[^.]+$/, '');
    return (window.__resources && window.__resources[id]) || path;
  };
  // Cross-page link targets (overridden in standalone bundles).
  window.HOME_HREF = window.HOME_HREF || 'portfolio.html';
  window.CS_HREF = window.CS_HREF || 'case-study.html';
</script>
